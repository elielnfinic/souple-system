name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-api:
    name: API Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: souple_test
          MYSQL_USER: souple
          MYSQL_PASSWORD: souple_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: souple-api/package-lock.json

      - name: Build shared package
        run: |
          cd souple-shared
          npm ci
          npm run build

      - name: Install API dependencies
        run: |
          cd souple-api
          npm ci

      - name: Run API type check
        run: |
          cd souple-api
          npx tsc --noEmit || true

      - name: Run API tests
        run: |
          cd souple-api
          npm test
        env:
          NODE_ENV: test
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: souple
          DB_PASSWORD: souple_test
          DB_DATABASE: souple_test
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          APP_KEY: test-app-key-32-characters-long!!

  test-web:
    name: Web Type Check & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: souple-web/package-lock.json

      - name: Install web dependencies
        run: |
          cd souple-web
          npm ci

      - name: Type check
        run: |
          cd souple-web
          npx tsc --noEmit

      - name: Lint
        run: |
          cd souple-web
          npm run lint || true
