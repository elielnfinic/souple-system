version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: souple_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./souple-infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./souple-infra/nginx/sites:/etc/nginx/sites-enabled:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - api
      - web
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  api:
    restart: unless-stopped
    environment:
      - NODE_ENV=production

  web:
    restart: unless-stopped
    environment:
      - NODE_ENV=production

  mysql:
    restart: unless-stopped

  redis:
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}

volumes:
  certbot_certs:
  certbot_www:
