version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: souple_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_DATABASE:-souple_dev}
      MYSQL_USER: ${DB_USER:-souple}
      MYSQL_PASSWORD: ${DB_PASSWORD:-souple_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: souple_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./souple-api
      dockerfile: Dockerfile
    container_name: souple_api
    env_file:
      - ./souple-api/.env
    environment:
      - DB_HOST=mysql
      - REDIS_HOST=redis
    ports:
      - "3333:3333"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./souple-api:/app
      - /app/node_modules

  web:
    build:
      context: ./souple-web
      dockerfile: Dockerfile
    container_name: souple_web
    environment:
      - NEXT_PUBLIC_API_URL=http://api:3333
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  mysql_data:
  redis_data:
